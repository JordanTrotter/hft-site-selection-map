<title>HFT Site Selection</title>

<style>
  html,body,#map{height:100%;margin:0}
  .maplibregl-popup-content{font:13px/1.45 system-ui,sans-serif;padding:10px 12px}
  .maplibregl-popup-content b{display:inline-block;min-width:80px;color:#555}
  #gate{display:none;position:fixed;inset:0;z-index:9999;background:#1b1b1b;color:#eee;
        align-items:center;justify-content:center;font:15px/1.5 system-ui,sans-serif}

  #gate h1{font-size:17px;font-weight:600;margin:0 0 14px}

              background:#111;color:#eee;font-size:15px;box-sizing:border-box}
  #gate button{margin-top:10px;padding:9px 20px;border:0;border-radius:4px;
               background:#ff7a00;color:#111;font-weight:600;font-size:15px;cursor:pointer}
  #msg{min-height:20px;margin-top:10px;color:#ff8a8a;font-size:13px}
  #layer-panel{position:fixed;top:10px;right:10px;z-index:900;background:#fff;
               border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.4);
               font:13px/1.4 system-ui,sans-serif;padding:8px 10px;max-width:220px}
  #layer-panel label{display:block;margin:3px 0;cursor:pointer;white-space:nowrap}
  #layer-panel .basemaps{border-bottom:1px solid #ddd;margin-bottom:6px;padding-bottom:6px}
  #layer-panel button.base-btn{display:inline-block;margin:2px 4px 2px 0;padding:3px 8px;
               border:1px solid #999;border-radius:3px;background:#f4f4f4;cursor:pointer;font-size:12px}
  #layer-panel button.base-btn.active{background:#ff7a00;color:#111;border-color:#ff7a00}
</style></head><body>

function render(LAYERS){
var BASEMAPS = {
  Satellite: {type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, attribution:'Imagery &copy; Esri'},
  Streets: {type:'raster', tiles:['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png','https://b.tile.openstreetmap.org/{z}/{x}/{y}.png','https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, attribution:'&copy; OpenStreetMap'}
};
var activeBase = 'Streets';

var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    // one source + layer per basemap, toggled by visibility. Swapping tiles on a single
    // source with setTiles() hung the map going Streets -> Satellite (2026-10-27).
    sources: Object.fromEntries(Object.keys(BASEMAPS).map(function(n){ return ['base-'+n, BASEMAPS[n]]; })),
    layers: Object.keys(BASEMAPS).map(function(n){
      return {id:'base-'+n, type:'raster', source:'base-'+n,
              layout:{visibility: n === activeBase ? 'visible' : 'none'}};
    })
  },
  center: [-83.5, 32.5], zoom: 6
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');

var CURRENCY_FIELDS = ['PricePerAcre', 'TotalPrice', 'Current_Rotation_Value_per_acre', 'Total_Current_Rotation_Value', 'Liquidation_Value_per_acre', 'Total_Liquidation_Value'];
// A field whose value is a JSON array of row-objects renders as a real <table> in the
// popup instead of a key:value line. Add an entry here for any other grouped field.
var TABLE_FIELDS = {
  Trees: {cols: ['TreeNum','Species','DBH_in','Height_ft','Defect'],
          headers: ['#','Species','DBH (in)','Height (ft)','Defect']},
  Schedule: {cols: ['Activity','Year'], headers: ['Activity','Year']},
  Stand_Metrics: {cols: ['Metric','Value'], headers: ['Metric','Value']},
  Value_Table: {cols: ['Metric','PerAcre','Total'], headers: ['','Per Acre','Total']}
};
function rowTable(field, raw){
  var rows; try { rows = JSON.parse(raw); } catch(e) { return null; }
  if (!Array.isArray(rows) || !rows.length) return null;
  var spec = TABLE_FIELDS[field];
  var head = '<tr>'+spec.headers.map(function(h){return '<th style="text-align:left;padding:2px 8px 2px 0;border-bottom:1px solid #ccc">'+h+'</th>';}).join('')+'</tr>';
  var body = rows.map(function(r){
    return '<tr>'+spec.cols.map(function(c){return '<td style="padding:2px 8px 2px 0">'+(r[c]==null||r[c]===''?'-':r[c])+'</td>';}).join('')+'</tr>';
  }).join('');
  return '<table style="border-collapse:collapse;font-size:12px">'+head+body+'</table>';
}
function popupHtml(name, props){
  var rows = Object.keys(props).filter(function(k){
    var v = props[k];
    return v !== null && v !== undefined && v !== '' && !TABLE_FIELDS[k] && k.charAt(0) !== '_';
  }).map(function(k){
    var v = props[k];
    if (typeof v === 'number' && k === 'Acres') v = v.toLocaleString(undefined,{maximumFractionDigits:0}) + ' ac';
    else if (typeof v === 'number' && CURRENCY_FIELDS.indexOf(k) !== -1) v = '$' + v.toLocaleString(undefined,{maximumFractionDigits:0});
    else if (k === 'Link') v = '<a href="'+v+'" target="_blank" rel="noopener">View listing</a>';
    return '<div><b>'+k+'</b> '+String(v).split(String.fromCharCode(10)).join('<br>')+'</div>';
  });
  var tables = Object.keys(TABLE_FIELDS).filter(function(k){ return props[k]; }).map(function(k){
    return rowTable(k, props[k]) || '';
  });
  return '<div style="font-weight:600;margin-bottom:4px">'+name+'</div>' + rows.join('') + tables.join('');
}

function bboxOf(fc, acc){
  fc.features.forEach(function(f){
    var g = f.geometry; if (!g) return;
    (function walk(c){
      if (typeof c[0] === 'number'){
        if (c[0] < acc[0]) acc[0] = c[0];
        if (c[1] < acc[1]) acc[1] = c[1];
        if (c[0] > acc[2]) acc[2] = c[0];
        if (c[1] > acc[3]) acc[3] = c[1];
      } else { c.forEach(walk); }
    })(g.coordinates);
  });
  return acc;
}

map.on('load', function(){
  var overall = [Infinity, Infinity, -Infinity, -Infinity];
  var panelRows = [];

  LAYERS.forEach(function(cfg, idx){
    var srcId = 'src'+idx, polyId = 'poly'+idx, lineId = 'line'+idx, ptId = 'pt'+idx, lblId = 'lbl'+idx;
    map.addSource(srcId, {type:'geojson', data: cfg.data});
    if (cfg.data.features.length) overall = bboxOf(cfg.data, overall);

    var colorExpr = cfg.colorField
      ? ['coalesce', ['get', cfg.colorField], cfg.stroke]
      : cfg.stroke;

    map.addLayer({id:polyId, type:'fill', source:srcId, filter:['==',['geometry-type'],'Polygon'],
      paint:{'fill-color': cfg.colorField ? colorExpr : cfg.fill, 'fill-opacity': cfg.fillOpacity}});
    map.addLayer({id:polyId+'o', type:'line', source:srcId, filter:['==',['geometry-type'],'Polygon'],
      paint:{'line-color': colorExpr, 'line-width': 2}});
    map.addLayer({id:lineId, type:'line', source:srcId, filter:['==',['geometry-type'],'LineString'],
      paint:{'line-color': colorExpr, 'line-width': 2}});
    map.addLayer({id:ptId, type:'circle', source:srcId, filter:['==',['geometry-type'],'Point'],
      paint:{'circle-radius': 5, 'circle-color': cfg.fill, 'circle-stroke-color': cfg.stroke, 'circle-stroke-width': 1}});

    if (cfg.label){
      map.addLayer({id:lblId, type:'symbol', source:srcId,
        layout:{'text-field': ['get', cfg.label.field], 'text-size': cfg.label.size*1.3,
                'text-allow-overlap': true, 'text-anchor':'center'},
        paint:{'text-color': cfg.label.color,
               'text-halo-color': cfg.label.halo || '#fff', 'text-halo-width': 1.4}});
    }

    [polyId, lineId, ptId].forEach(function(id){
      map.on('click', id, function(e){
        var f = e.features[0];
        new maplibregl.Popup().setLngLat(e.lngLat)
          .setHTML(popupHtml(cfg.name, f.properties||{})).addTo(map);
      });
      map.on('mouseenter', id, function(){ map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', id, function(){ map.getCanvas().style.cursor = ''; });
    });

    var ids = [polyId,polyId+'o',lineId,ptId,lblId];
    if (cfg.visible === false) ids.forEach(function(id){
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
    });
    panelRows.push('<label><input type="checkbox"'+(cfg.visible === false ? '' : ' checked')+' data-layers="'+
      ids.join(',')+'"> '+cfg.name+'</label>');
  });

  if (overall[0] < overall[2]){
    map.fitBounds([[overall[0],overall[1]],[overall[2],overall[3]]], {padding:30, duration:0});
  }

  var panel = document.createElement('div');
  panel.id = 'layer-panel';
  var baseBtns = Object.keys(BASEMAPS).map(function(name){
    return '<button class="base-btn'+(name===activeBase?' active':'')+'" data-base="'+name+'">'+name+'</button>';
  }).join('');
  panel.innerHTML = '<div class="basemaps">'+baseBtns+'</div>' + panelRows.join('');
  document.body.appendChild(panel);

  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){
      cb.dataset.layers.split(',').forEach(function(id){
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none');
      });
    });
  });
  panel.querySelectorAll('.base-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      Object.keys(BASEMAPS).forEach(function(n){
        map.setLayoutProperty('base-'+n, 'visibility', n === btn.dataset.base ? 'visible' : 'none');
      });
      panel.querySelectorAll('.base-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

var raw = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)})};
document.getElementById('gate').style.display = 'flex';
document.getElementById('go').onclick = async function(){
  var msg = document.getElementById('msg'), pw = document.getElementById('pw').value;
  msg.textContent = 'Decrypting...';
  try {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:raw(ENC.salt), iterations:ENC.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw(ENC.iv)}, key, raw(ENC.ct));
    document.getElementById('gate').remove();
    render(JSON.parse(new TextDecoder().decode(out)));
  } catch(e) { msg.textContent = 'Wrong passphrase.'; }
};
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('go').click();
});
